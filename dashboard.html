<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DecorFind — Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    
    
    body { 
      font-family:"Montserrat",
      sans-serif; background:var(--light-pink-color); }
    .dash-wrap { 
      max-width:1100px; 
      margin:0 auto; 
      padding:110px 20px 60px; 
    }

    .dash-header { 
      display:flex; 
      align-items:center; 
      justify-content:space-between; 
      flex-wrap:wrap; 
      gap:14px; 
      margin-bottom:24px; 
    }

    .dash-header h1 { 
      font-size:var(--font-size-x1); 
      color:var(--primary-color); 
    }

    .stat-pill { 
      background:var(--white-color); 
      border-radius:var(--border-radius-m); 
      padding:8px 18px; 
      box-shadow:0 2px 10px rgba(0,0,0,.06); 
      font-size:var(--font-size-s); 
      color:#666; 
    }

    .stat-pill b { 
      color:var(--primary-color); 
      font-size:var(--font-size-m); 
    }
    .token-bar { 
      display:flex; 
      gap:10px; 
      margin-bottom:24px; 
    
    }

    .token-bar input { 
      flex:1; height:46px; 
      padding:0 14px; 
      border:1px solid var(--medium-gray-color); 
      border-radius:var(--border-radius-s); 
      font-family:inherit;
    }

    .token-bar button { 
      padding:0 22px; 
      background:var(--primary-color); 
      color:var(--white-color); 
      border-radius:var(--border-radius-m); 
      font-weight:600; 
      font-family:inherit; 
      cursor:pointer; 
      border:none; 
    }
    .reply-card { 
      background:var(--white-color); 
      border-radius:12px; 
      box-shadow:0 2px 10px rgba(0,0,0,.06); 
      border-left:5px solid var(--secondary-color); 
      padding:18px 22px; 
      margin-bottom:14px; 
    }
    .reply-card .from { 
      font-weight:600; 
      color:var(--primary-color); 
    }
    .reply-card .meta { 
      font-size:.82rem; 
      color:#888; 
      margin:4px 0 10px; 
    }
    .reply-card .subject { 
      font-weight:600; 
      margin-bottom:8px; 
    }
    .reply-card .body { 
      white-space:pre-wrap; 
      font-size:var(--font-size-s); 
      color:#444; 
      max-height:260px; 
      overflow:auto; 
      line-height:1.6; 
    }
    .reply-card .body img { 
      max-width:100%;
     }
    .reply-actions { 
      margin-top:12px; 
      display:flex; 
      gap:10px; 
    }
    .reply-actions button { 
      padding:8px 16px; 
      border:none; 
      border-radius:var(--border-radius-s); 
      background:var(--primary-color);
      color:#fff; 
      font-family:inherit; 
      cursor:pointer; 
      font-size:var(--font-size-s); 
    }
    .reply-actions button.html-btn { 
      background:var(--secondary-color); 
      color:var(--primary-color); 
    }
    .empty { 
      text-align:center; 
      color:#888; 
      padding:60px 0; 
    }

    #status-line { 
      font-size:var(--font-size-s); 
      color:#888; 
      margin-bottom:14px; 
    }
  </style>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar section-content">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-couch logo-icon"></i>
        <h2 class="logo-text">DecorFind</h2>
      </a>
      <ul class="nav-menu" id="nav-menu">
        <button id="menu-close-button" class="fas fa-times"></button>
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="dashboard.html" class="nav-link">Replies</a></li>
      </ul>
      <button id="menu-open-button" class="fas fa-bars"></button>
    </nav>
  </header>

  <div class="dash-wrap">
    <div class="dash-header">
      <h1><i class="fa-solid fa-inbox"></i> Buyer Replies</h1>
      <div class="stat-pill"><b id="reply-count">0</b> replies received</div>
    </div>

    <div class="token-bar" id="token-bar">
      <input id="token-input" type="password" placeholder="Dashboard token (set in Render as DASHBOARD_TOKEN)">
      <button onclick="saveToken()">Unlock</button>
    </div>

    <p id="status-line"></p>
    <div id="reply-list"></div>
  </div>
</body>
</html>
